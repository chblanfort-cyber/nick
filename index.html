<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Made by a Grade 8 student</p>

    <div class="scoreboard">
        <div>You: <span id="player-score">0</span></div>
        <div>Computer: <span id="computer-score">0</span></div>
    </div>

    <div class="choices">
        <button class="choice-btn" data-choice="rock">🪨 Rock</button>
        <button class="choice-btn" data-choice="paper">📄 Paper</button>
        <button class="choice-btn" data-choice="scissors">✂️ Scissors</button>
    </div>

    <div class="result-area">
        <p id="result-text">Make your move!</p>
        <p>You chose: <span id="player-choice">—</span></p>
        <p>Computer chose: <span id="computer-choice">—</span></p>
    </div>

    <button id="reset-btn">Reset Scores</button>

    <script src="script.js"></script>
</body>
</html>
